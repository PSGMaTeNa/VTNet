[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
ed25519-dalek = "2.2"
futures-util = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.32", features = ["bundled"] }
shared = { path = "../shared" }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = "1.0"
